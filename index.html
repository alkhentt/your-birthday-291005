<style>
:root{--bg:#0d0a14;--tx:#fff;--mu:rgba(255,255,255,.68);--gl:rgba(255,255,255,.1);--gl2:rgba(255,255,255,.17);--bd:rgba(255,255,255,.2);--pk:#ff6fa5;--pk2:#ff9a8b;--go:#ffd479;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;touch-action:manipulation}
[hidden]{display:none!important}
#wp{position:fixed;inset:0;overflow:hidden}
.au{position:absolute;border-radius:50%;filter:blur(70px);animation:dr 14s ease-in-out infinite alternate}
.a1{width:360px;height:360px;background:#e0447c;top:-90px;left:-110px;opacity:.6}
.a2{width:320px;height:320px;background:#f0a23a;bottom:-70px;right:-100px;opacity:.5;animation-delay:-5s}
.a3{width:280px;height:280px;background:#7b46d8;top:38%;left:50%;opacity:.35;animation-delay:-9s}
@keyframes dr{to{transform:translate(40px,-60px) scale(1.2)}}
#bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#ov{position:absolute;inset:0;background:linear-gradient(rgba(13,10,20,.35),rgba(13,10,20,.15) 45%,rgba(13,10,20,.6));transition:.8s}
body.chat #ov{background:rgba(13,10,20,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}

/* lock screen */
#lock{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 64px) 22px calc(var(--sb) + 26px);transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .7s;touch-action:none;text-shadow:0 2px 18px rgba(0,0,0,.4)}
#lock.gone{transform:translateY(-105%)!important;opacity:0;pointer-events:none}
#ld{font-size:18px;font-weight:600;letter-spacing:.02em}
#lc{font-size:92px;font-weight:300;letter-spacing:-3px;line-height:1.05}
.nt{margin-top:auto;width:100%;max-width:380px;display:flex;gap:12px;padding:14px;border-radius:22px;background:var(--gl2);border:1px solid var(--bd);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);text-align:left;animation:nin 1s .7s both cubic-bezier(.2,.9,.3,1.2)}
@keyframes nin{from{opacity:0;transform:translateY(40px) scale(.96)}}
.ni{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--pk),var(--pk2));display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.nb{min-width:0;flex:1}
.nh{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;color:var(--mu)}
.nb strong{display:block;font-size:15px;margin-top:2px}
.nb p{margin:2px 0 0;font-size:14px;color:var(--mu)}
.sw{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--mu);letter-spacing:.06em;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

/* chat */
#app{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;opacity:0;transition:opacity .6s}
body.chat #app{opacity:1}
#hd{display:flex;align-items:center;gap:12px;padding:calc(var(--st) + 10px) 16px 12px;background:var(--gl);border-bottom:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#av{position:relative;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--pk),var(--go));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
#av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hn b{display:block;font-size:16px}
.hn small{color:#7ef0b0;font-size:12px}
#th{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px 10px;display:flex;flex-direction:column;gap:7px;scrollbar-width:none}
#th::-webkit-scrollbar{display:none}
.m{display:flex;animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
.m.in{justify-content:flex-start}.m.out{justify-content:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.92)}}
.b{position:relative;max-width:80%;padding:10px 14px;border-radius:20px;font-size:15.5px;line-height:1.45;word-wrap:break-word}
.in .b{background:var(--gl2);border:1px solid var(--bd);border-bottom-left-radius:6px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.out .b{background:linear-gradient(135deg,var(--pk),var(--pk2));border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(255,111,165,.35)}
.tm{float:right;margin:7px 0 -3px 10px;font-size:10.5px;opacity:.6}
.rx{position:absolute;right:8px;bottom:-11px;font-size:13px;background:var(--gl2);border:1px solid var(--bd);border-radius:99px;padding:1px 6px;animation:pop .3s}
.ty{display:flex;gap:5px;padding:14px 16px}
.ty i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:tp 1s infinite}
.ty i:nth-child(2){animation-delay:.15s}.ty i:nth-child(3){animation-delay:.3s}
@keyframes tp{30%{transform:translateY(-5px);background:#fff}}
#ft{padding:10px 14px calc(var(--sb) + 12px);background:var(--gl);border-top:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);min-height:70px;display:flex;align-items:center}
#fk{flex:1;height:46px;border-radius:23px;background:var(--gl);border:1px solid var(--bd);color:var(--mu);display:flex;align-items:center;padding:0 18px;font-size:15px}
#ch{display:none;flex:1;flex-wrap:wrap;gap:8px;justify-content:center}
#ch.on{display:flex}

/* buttons */
button{font:inherit;font-weight:600;font-size:15px;color:#fff;border:0;border-radius:99px;min-height:46px;padding:0 22px;background:linear-gradient(120deg,var(--pk),var(--pk2));box-shadow:0 8px 24px rgba(255,111,165,.4)}
button:active{transform:scale(.95)}
button.o{background:var(--gl);border:1px solid var(--bd);box-shadow:none}

/* cards */
.cardx{width:min(320px,86vw);padding:16px;border-radius:24px;border-bottom-left-radius:8px;background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);text-align:center}
.cardx h3{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:24px;margin:4px 0}
.cardx p{margin:4px 0 12px;font-size:13.5px;line-height:1.55;color:var(--mu)}
.cardx small{display:block;margin-top:8px;font-size:11.5px;color:var(--mu)}
.ey{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--go);font-weight:700}
.ln{width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--go),transparent);margin:16px auto}
.gl{background:var(--gl2);border:1px solid var(--bd);border-radius:16px;padding:12px}
/* banner */
.bn{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700;font-size:48px;line-height:1.1;margin:8px 0 4px;background:linear-gradient(120deg,#fff,var(--pk) 55%,var(--go));-webkit-background-clip:text;background-clip:text;color:transparent}
.bt{font-size:16px;color:var(--mu)}
/* voice */
.vn{display:flex;align-items:center;gap:12px;width:auto;max-width:86vw;padding:12px 16px;text-align:left}
.vp{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;flex:none}
.wv{display:flex;align-items:center;gap:2.5px;height:34px}
.wv i{width:3px;border-radius:2px;background:rgba(255,255,255,.35);transition:background .2s}
.wv i.on{background:var(--pk)}
.vn small{margin:0}
/* cake */
.cake{position:relative;width:230px;height:190px;margin:30px auto 14px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5))}
.pl{position:absolute;bottom:0;left:-14px;right:-14px;height:12px;border-radius:8px;background:linear-gradient(#f4e6ea,#c9aab5)}
.l1,.l2{position:absolute;border-radius:12px 12px 5px 5px}
.l1{bottom:12px;left:0;right:0;height:70px;background:linear-gradient(#f9c6d1,#e58ba2)}
.l2{bottom:82px;left:32px;right:32px;height:54px;background:linear-gradient(#fff1d6,#e9c46a)}
.l1:before,.l2:before{content:"";position:absolute;inset:0 0 auto;height:14px;background:radial-gradient(circle at 10px 14px,#fff 9px,transparent 10px) 0 0/22px 14px repeat-x}
.cd{position:absolute;bottom:134px;width:12px;height:42px;border-radius:3px;background:linear-gradient(90deg,#fff,#e8d9de)}
.cd:before{content:"";position:absolute;inset:-34px -16px 0}
.cd:after{content:"";position:absolute;top:-26px;left:-3px;width:18px;height:28px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;background:radial-gradient(#fff7c4,#ffb300 60%,#ff6a00);box-shadow:0 0 26px 10px rgba(255,179,0,.45);animation:fk .25s infinite alternate;transform-origin:bottom}
.cd.o:after{display:none}
@keyframes fk{to{transform:scale(1.12,.86) rotate(5deg)}}
.wi{min-height:26px;font-weight:600;margin:4px 0}
.mic{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
/* heart */
.hw{width:150px;margin:6px auto;touch-action:none;filter:drop-shadow(0 0 22px rgba(255,111,165,.55))}
.hw svg{width:100%;display:block}
.pct{font-family:'Playfair Display',Georgia,serif;font-size:28px;color:var(--pk);min-height:38px}
/* scratch */
.sw2{position:relative;height:150px;border-radius:18px;overflow:hidden;margin-top:10px;box-shadow:0 0 0 1px var(--bd)}
.sb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:20px;line-height:1.4;background:linear-gradient(135deg,#3b1730,#1d0a1a)}
.sw2 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;transition:opacity .8s}
/* memory */
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1;perspective:500px}
.mi{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.f .mi{transform:rotateY(180deg)}
.mi>div{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:26px}
.ma{background:var(--gl2);border:1px solid var(--bd);color:var(--pk);font-size:18px!important}
.mf{background:linear-gradient(135deg,#ffe3e9,#ffb6cb);transform:rotateY(180deg)}
.mc.m .mf{background:linear-gradient(135deg,#fff1d6,var(--go));box-shadow:0 0 18px var(--go)}
/* egg */
.egw{position:relative;width:150px;height:190px;margin:14px auto 8px}
.eg{position:absolute;inset:0;cursor:pointer;--a:4deg;filter:drop-shadow(0 0 8px rgba(255,212,121,.35))}
.eg:not(.sh){animation:eidle 2.4s ease-in-out infinite}
.eg.sh{animation:egs .45s}
@keyframes eidle{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg) translateY(-3px)}}
@keyframes egs{0%,100%{transform:rotate(0)}20%{transform:rotate(calc(var(--a)*-1)) translateX(-3px)}40%{transform:rotate(var(--a)) translateX(3px)}60%{transform:rotate(calc(var(--a)*-1))}80%{transform:rotate(var(--a))}}
.es{width:100%;height:100%;display:block}
.ck2{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ck2 path{fill:none;stroke:#8a3550;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:dsh .4s forwards}
@keyframes dsh{to{stroke-dashoffset:0}}
.eh,.ek{position:absolute;inset:0;display:none}
.eh{clip-path:polygon(0 0,100% 0,100% 52%,88% 46%,76% 54%,62% 46%,50% 54%,38% 46%,24% 54%,12% 46%,0 52%)}
.ek{clip-path:polygon(0 52%,12% 46%,24% 54%,38% 46%,50% 54%,62% 46%,76% 54%,88% 46%,100% 52%,100% 100%,0 100%)}
.eh.go{display:block;animation:ehs 1s ease-out forwards}
.ek.go{display:block;animation:eks 1s ease-out forwards}
@keyframes ehs{to{transform:translate(-22px,-80px) rotate(-26deg);opacity:0}}
@keyframes eks{to{transform:translate(16px,46px) rotate(14deg);opacity:0}}
.fh{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(#fff,rgba(255,212,121,.55) 40%,transparent 70%);opacity:0;z-index:1}
.fh.go{animation:fhs .9s forwards}
@keyframes fhs{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(14)}}
.pe{position:absolute;left:50%;top:50%;font-size:64px;opacity:0;z-index:3;transform:translate(-50%,-50%) scale(0)}
.pe.go{animation:pes 1.2s .25s forwards cubic-bezier(.2,1.4,.4,1)}
@keyframes pes{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}60%{opacity:1;transform:translate(-50%,-90%) scale(1.3) rotate(-10deg)}100%{opacity:1;transform:translate(-50%,-70%) scale(1)}}
.et2{min-height:22px;font-weight:600;font-size:14px;color:var(--mu);margin-bottom:8px}
.rs{margin-bottom:4px}
/* photos */
.ps{position:relative;width:210px;height:275px;margin:8px auto}
.pc{position:absolute;inset:0;background:#fff;padding:10px 10px 0;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.55);touch-action:none;color:#3b1f2e;display:flex;flex-direction:column}
.pc img{width:100%;height:205px;object-fit:cover;border-radius:3px;pointer-events:none}
.cp{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:15px}
/* end */
#end{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:rgba(13,10,20,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity 1s}
#end.on{opacity:1}
#end h1{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(44px,14vw,72px);margin:10px 0;line-height:1.1;background:linear-gradient(120deg,#fff,var(--pk) 55%,var(--go));-webkit-background-clip:text;background-clip:text;color:transparent}
#end h2{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:22px;margin:14px 0 6px}
#end p{max-width:320px;line-height:1.7;color:var(--mu);margin:0 0 16px}
#end small{color:var(--mu);margin-bottom:22px}
#dy b{color:var(--pk)}
#ed{position:fixed;top:calc(var(--st) + 8px);right:10px;z-index:60;min-height:34px;padding:0 12px;font-size:11px}
</style>
</head>
<body>
<div id="wp">
  <div class="au a1"></div><div class="au a2"></div><div class="au a3"></div>
  <video id="bgv" muted loop playsinline preload="auto"></video>
  <div id="ov"></div>
</div>
<canvas id="fx"></canvas>

<section id="lock">
  <div id="ld"></div>
  <div id="lc">09.41</div>
  <div class="nt" id="nt">
    <div class="ni">💌</div>

</div>

  <h1>Jarak cuma angka</h1>
  <div class="ln"></div>
  <p id="et"></p>
  <div class="gl" id="dy" hidden></div>

<script>
(function () {
'use strict';
var C = window.CFG || {}, Q = new URLSearchParams(location.search);
var N = Q.get('nama') || C.nama || 'Sayang';
var D = Q.get('dari') || C.dari || 'Aku';
var S = Q.get('sejak') || C.sejak || '';
var $ = function (s, r) { return (r || document).querySelector(s); };
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var fmt = function (t) { return String(t).replace(/\{nama\}/g, N).replace(/\{dari\}/g, D); };
function vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function shuffle(a) { return a.sort(function () { return Math.random() - .5; }); }

/* ---------- identitas ---------- */
$('#nn').textContent = D;
$('#hnm').textContent = D;
$('#avl').textContent = (D[0] || 'A').toUpperCase();
if (C.avatar) {
  var ai = $('#avi');
  ai.onload = function () { ai.hidden = false; };
  ai.src = C.avatar;
}

/* ---------- video background ---------- */
